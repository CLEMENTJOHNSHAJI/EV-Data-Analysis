<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEV vs PHEV Fleet by City</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: #1a1a1a; background: #f4f6f8; padding: 28px 16px; }
    .card { max-width: 960px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 24px 28px; }
    h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
    p.sub { margin: 0 0 16px; color: #555; font-size: 13px; text-align: center; }
    .chart-wrap { position: relative; height: 480px; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 20px; }
    th, td { border: 1px solid #e2e6ea; padding: 6px 8px; text-align: right; }
    th { background: #f0f3f6; }
    td:first-child, th:first-child { text-align: left; }
    .controls { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BEV vs PHEV Fleet by City</h1>
    <p class="sub">Cumulative EV fleet (2010–2025) &middot; Source: Traficom (kanta_010)</p>
    <div class="chart-wrap"><canvas id="fleetChart"></canvas></div>
    <table>
      <thead>
        <tr><th>City</th><th>BEV</th><th>PHEV</th><th>Total EV Fleet</th><th>BEV Share</th><th>PHEV Share</th></tr>
      </thead>
      <tbody>
        <tr><td>Helsinki</td><td>31,408</td><td>27,108</td><td>58,516</td><td>53.7%</td><td>46.3%</td></tr>
        <tr><td>Tampere</td><td>8,189</td><td>8,069</td><td>16,258</td><td>50.4%</td><td>49.6%</td></tr>
        <tr><td>Oulu</td><td>6,857</td><td>6,180</td><td>13,037</td><td>52.6%</td><td>47.4%</td></tr>
      </tbody>
    </table>
    <div class="controls">
      <button id="downloadBtn">Download PNG</button>
    </div>
  </div>
  <script>
    const cities = ["Helsinki", "Tampere", "Oulu"];
    const bev  = [31408, 8189, 6857];
    const phev = [27108, 8069, 6180];
    const bevShare  = [53.7, 50.4, 52.6];
    const phevShare = [46.3, 49.6, 47.4];

    const chart = new Chart(document.getElementById("fleetChart"), {
      type: "bar",
      data: {
        labels: cities,
        datasets: [
          { label: "BEV", data: bev, backgroundColor: "#2563eb", borderRadius: 4, maxBarThickness: 70 },
          { label: "PHEV", data: phev, backgroundColor: "#f59e0b", borderRadius: 4, maxBarThickness: 70 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { position: "top", labels: { usePointStyle: true, font: { size: 13 } } },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const share = ctx.dataset.label === "BEV" ? bevShare[ctx.dataIndex] : phevShare[ctx.dataIndex];
                return ctx.dataset.label + ": " + ctx.parsed.y.toLocaleString() + " (" + share + "%)";
              },
            },
          },
        },
        scales: {
          x: { grid: { display: false }, title: { display: true, text: "City" } },
          y: { beginAtZero: true, title: { display: true, text: "Number of vehicles" }, grid: { color: "rgba(0,0,0,.06)" } },
        },
      },
      plugins: [{
        id: "valueLabels",
        afterDatasetsDraw(c) {
          const { ctx } = c;
          ctx.save();
          ctx.font = "600 11px Segoe UI, Arial";
          ctx.fillStyle = "#1a1a1a";
          ctx.textAlign = "center";
          c.data.datasets.forEach((ds, i) => {
            const meta = c.getDatasetMeta(i);
            const share = ds.label === "BEV" ? bevShare : phevShare;
            meta.data.forEach((bar, idx) => {
              ctx.fillText(ds.data[idx].toLocaleString(), bar.x, bar.y - 18);
              ctx.fillText("(" + share[idx] + "%)", bar.x, bar.y - 6);
            });
          });
          ctx.restore();
        },
      }],
    });

    document.getElementById("downloadBtn").onclick = () => {
      const src = chart.canvas, tmp = document.createElement("canvas");
      tmp.width = src.width; tmp.height = src.height;
      const c = tmp.getContext("2d");
      c.fillStyle = "#fff"; c.fillRect(0, 0, tmp.width, tmp.height); c.drawImage(src, 0, 0);
      const a = document.createElement("a");
      a.download = "ev_bev_phev_fleet.png";
      a.href = tmp.toDataURL("image/png");
      a.click();
    };
  </script>
</body>
</html>
